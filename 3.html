<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Map Freehand Drawing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
  body { 
    margin:0; 
    font-family: "Segoe UI", Arial, sans-serif; 
    background: linear-gradient(135deg, #eef3f9 0%, #f9fafc 100%);
  }
  #map { 
    width:100%; 
    height:90vh; 
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    border-radius: 8px;
  }
  #toolbar { 
    padding:10px; 
    text-align:center; 
    background:rgba(255,255,255,0.95);
    border-radius: 12px;
    margin:10px auto;
    width: fit-content;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  select, button { 
    margin:3px; 
    padding:6px 10px; 
    font-size:14px; 
    border-radius:6px;
    border:1px solid #ccc;
    background:#fff;
    transition: all 0.2s ease;
  }
  select:focus {
    border-color:#0078ff;
    box-shadow:0 0 5px rgba(0,120,255,0.4);
    outline:none;
  }
  button {
    background:#0078ff;
    color:#fff;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  button:hover { background:#005ec2; transform:translateY(-1px); }
  h2 { text-align:center; color:#2b3d52; margin-top:15px; }
</style>
</head>
<body>

<h2>🗺️ Draw on India Map (Freehand Pencil Mode)</h2>

<div id="toolbar">
  <label>Fill Color:</label>
  <select id="fillColor">
    <option value="orange">Orange</option>
    <option value="red">Red</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>
    <option value="yellow">Yellow</option>
    <option value="purple">Purple</option>
  </select>
  <label>Stroke Color:</label>
  <select id="strokeColor">
    <option value="red">Red</option>
    <option value="black">Black</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="orange">Orange</option>
    <option value="purple">Purple</option>
  </select>
  <button id="togglePencil">✏️ Enable Freehand Pencil</button>
  <button onclick="exportGeoJSON()">💾 Export GeoJSON</button>
  <button onclick="exportPNG()">🖼️ Export PNG</button>
</div>

<div id="map"></div>

<!-- Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/src/dom-to-image.min.js"></script>

<script>
// === MAP INITIALIZATION ===
const map = L.map('map', { center: [23, 82], zoom: 5 });

// Base layers
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
const terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 });
L.control.layers({OSM: osm, Satellite: satellite, Terrain: terrain}).addTo(map);

// India boundary
fetch('india.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style:{ color:'#000', weight:1.5, fillOpacity:0.05 },
      interactive: false
    }).addTo(map);
  })
  .catch(err => console.error("Error loading india.geojson:", err));

// === DRAWING LAYERS ===
const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

let drawControl = new L.Control.Draw({
  edit: { featureGroup: drawnItems },
  draw: {
    polygon: { allowIntersection: false, shapeOptions: { color: 'red', fillColor:'orange', fillOpacity:0.5 } },
    rectangle: { shapeOptions: { color: 'red', fillColor:'orange', fillOpacity:0.5 } },
    circle: { shapeOptions: { color: 'red', fillColor:'orange', fillOpacity:0.5 } },
    circlemarker: { shapeOptions: { color: 'red', fillColor:'orange', fillOpacity:0.5 } },
    polyline: { shapeOptions: { color: 'red' } },
    marker: true
  }
});
map.addControl(drawControl);

function updateDrawingOptions() {
  const fill = document.getElementById('fillColor').value;
  const stroke = document.getElementById('strokeColor').value;
  drawControl.setDrawingOptions({
    polygon: { color: stroke, fillColor: fill, fillOpacity:0.5 },
    rectangle: { color: stroke, fillColor: fill, fillOpacity:0.5 },
    circle: { color: stroke, fillColor: fill, fillOpacity:0.5 },
    circlemarker: { color: stroke, fillColor: fill, fillOpacity:0.5 },
    polyline: { color: stroke }
  });
}
document.getElementById('fillColor').addEventListener('change', updateDrawingOptions);
document.getElementById('strokeColor').addEventListener('change', updateDrawingOptions);

map.on(L.Draw.Event.CREATED, e => drawnItems.addLayer(e.layer));

// === FREEHAND PENCIL ===
let isDrawing = false;
let currentLine = null;
let drawnPolygons = [];
const pencilButton = document.getElementById('togglePencil');
const fillColorSelect = document.getElementById('fillColor');

pencilButton.addEventListener('click', () => {
  isDrawing = !isDrawing;
  pencilButton.textContent = isDrawing ? "🛑 Disable Freehand Pencil" : "✏️ Enable Freehand Pencil";
  pencilButton.style.background = isDrawing ? "#d32f2f" : "#0078ff";

  if (isDrawing) {
    map.getContainer().style.cursor = "crosshair";
    map.dragging.disable(); map.touchZoom.disable();
    map.doubleClickZoom.disable(); map.scrollWheelZoom.disable();
    map.boxZoom.disable(); map.keyboard.disable();
  } else {
    map.getContainer().style.cursor = "";
    map.dragging.enable(); map.touchZoom.enable();
    map.doubleClickZoom.enable(); map.scrollWheelZoom.enable();
    map.boxZoom.enable(); map.keyboard.enable();
  }
});

map.on('mousedown', e => {
  if(!isDrawing) return;
  currentLine = L.polyline([e.latlng], {
    color: document.getElementById('strokeColor').value,
    fillOpacity: 0
  }).addTo(drawnItems);
});
map.on('mousemove', e => {
  if(!isDrawing || !currentLine) return;
  currentLine.addLatLng(e.latlng);
});
map.on('mouseup', e => {
  if(!isDrawing || !currentLine) return;
  const latlngs = currentLine.getLatLngs();
  if(latlngs.length > 2){
    const polygon = L.polygon(latlngs, {
      color: currentLine.options.color,
      fillColor: fillColorSelect.value,
      fillOpacity: 0.5
    }).addTo(drawnItems);
    drawnPolygons.push(polygon);
    map.removeLayer(currentLine);
  }
  currentLine = null;
});

fillColorSelect.addEventListener('change', () => {
  drawnPolygons.forEach(poly => {
    poly.setStyle({ fillColor: fillColorSelect.value });
  });
});

// === EXPORT FUNCTIONS ===
function exportGeoJSON() {
  const geojson = drawnItems.toGeoJSON();
  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(geojson, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = 'drawing.geojson';
  a.click();
}

function exportPNG() {
  domtoimage.toPng(document.getElementById('map'))
    .then(function(dataUrl){
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'map_drawing.png';
      a.click();
    })
    .catch(function(error){
      console.error('PNG export failed:', error);
    });
}
</script>

</body>
</html>
