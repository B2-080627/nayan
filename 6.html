<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Map with Leaflet Draw + Freehand + Font Customization + Eraser</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
  body { margin:0; font-family: Arial, sans-serif; }
  #map { width:100%; height:90vh; }
  #toolbar { padding:8px; text-align:center; background:#f0f0f0; }
  select, button, input { margin:3px; padding:5px 10px; font-size:14px; }
  .polygon-label { cursor:pointer; }
</style>
</head>
<body>

<h2 style="text-align:center;">Interactive Map with Freehand Drawing by Nayan</h2>

<div id="toolbar">
  <label>Fill Color:</label>
  <select id="fillColor">
    <option value="orange" selected>Orange</option>
    <option value="red">Red</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>
    <option value="yellow">Yellow</option>
    <option value="purple">Purple</option>
  </select>

  <label>Stroke Color:</label>
  <select id="strokeColor">
    <option value="red" selected>Red</option>
    <option value="black">Black</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="orange">Orange</option>
    <option value="purple">Purple</option>
  </select>

  <label>Label Color:</label>
  <input type="color" id="labelColor" value="#000000">

  <label>Font:</label>
  <select id="labelFont">
    <option value="Arial" selected>Arial</option>
    <option value="Verdana">Verdana</option>
    <option value="Times New Roman">Times New Roman</option>
    <option value="Courier New">Courier New</option>
    <option value="Georgia">Georgia</option>
  </select>

  <label>Font Size:</label>
  <select id="labelFontSize">
    <option value="12px">12px</option>
    <option value="14px" selected>14px</option>
    <option value="16px">16px</option>
    <option value="18px">18px</option>
    <option value="20px">20px</option>
    <option value="24px">24px</option>
    <option value="28px">28px</option>
  </select>

  <button id="togglePencil">Enable Freehand Pencil</button>
  <button id="toggleEraser">Enable Eraser</button>
  <button onclick="exportGeoJSON()">Export GeoJSON</button>
  <button onclick="exportPNG()">Export PNG</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/src/dom-to-image.min.js"></script>

<script>
const map = L.map('map', { center: [20, 80], zoom: 4 });

// Base layers
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap:true }).addTo(map);
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, noWrap:true });
const terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, noWrap:true });
L.control.layers({OSM: osm, Satellite: satellite, Terrain: terrain}).addTo(map);

// Feature group for drawn shapes
const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

// Optional: India boundary
fetch('india.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: { color:'#000000', weight:2, fillColor:'#000000', fillOpacity:0.2 },
      interactive: false
    }).addTo(map);
  })
  .catch(err => console.warn("india.geojson not loaded:", err));

// --- Leaflet Draw Toolbar ---
const drawControl = new L.Control.Draw({
  draw: {
    polyline: { shapeOptions: { color: document.getElementById('strokeColor').value } },
    polygon: { allowIntersection: false },
    rectangle: true,
    circle: true,
    marker: true,
    circlemarker: false
  },
  edit: { featureGroup: drawnItems, remove: true }
});
map.addControl(drawControl);

const shapesWithLabels = [];

// Create label function
function createLabelIcon(name, color, font, size){
  return L.divIcon({
    className: 'polygon-label',
    html: `<span style="color:${color}; font-family:${font}; font-size:${size}; font-weight:bold;">${name}</span>`,
    iconSize: [120,40]
  });
}

// When a new shape is created
map.on(L.Draw.Event.CREATED, function (e) {
  const type = e.layerType;
  const layer = e.layer;

  const fillColor = document.getElementById('fillColor').value;
  const strokeColor = document.getElementById('strokeColor').value;
  const labelColor = document.getElementById('labelColor').value;
  const font = document.getElementById('labelFont').value;
  const fontSize = document.getElementById('labelFontSize').value;

  if(type === 'polygon' || type === 'rectangle' || type === 'circle'){
    layer.setStyle({
      color: strokeColor,
      fillColor: fillColor,
      fillOpacity: 0.5
    });
  }

  drawnItems.addLayer(layer);

  // Ask for label
  if(type === 'polygon' || type === 'rectangle' || type === 'circle'){
    const name = prompt("Enter a name for this shape:");
    if(name){
      const center = layer.getBounds ? layer.getBounds().getCenter() : layer.getLatLng();
      const marker = L.marker(center, {
        icon: createLabelIcon(name, labelColor, font, fontSize),
        draggable: true
      }).addTo(drawnItems);

      // Allow editing label text later
      marker.on('click', () => {
        const newName = prompt("Edit label:", name);
        if(newName){
          marker.setIcon(createLabelIcon(newName, labelColor, font, fontSize));
        }
      });

      shapesWithLabels.push({shape: layer, label: marker});
    }
  }
});

// --- Freehand Pencil ---
let isDrawing = false, currentLine = null;
const pencilButton = document.getElementById('togglePencil');

pencilButton.addEventListener('click', () => {
  if (isErasing) toggleEraser(false); // disable eraser if active
  isDrawing = !isDrawing;
  pencilButton.textContent = isDrawing ? "Disable Freehand Pencil" : "Enable Freehand Pencil";
  map.getContainer().style.cursor = isDrawing ? "crosshair" : "";
  if(isDrawing){
    map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
    map.scrollWheelZoom.disable(); map.boxZoom.disable(); map.keyboard.disable();
  } else {
    map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable();
    map.scrollWheelZoom.enable(); map.boxZoom.enable(); map.keyboard.enable();
  }
});

map.on('mousedown', e => {
  if(!isDrawing) return;
  const strokeColor = document.getElementById('strokeColor').value;
  currentLine = L.polyline([e.latlng], { color: strokeColor }).addTo(drawnItems);
});

map.on('mousemove', e => {
  if(!isDrawing || !currentLine) return;
  currentLine.addLatLng(e.latlng);
});

map.on('mouseup', e => {
  if(!isDrawing || !currentLine) return;
  const latlngs = currentLine.getLatLngs();
  if(latlngs.length > 2){
    const fillColor = document.getElementById('fillColor').value;
    const strokeColor = document.getElementById('strokeColor').value;
    const labelColor = document.getElementById('labelColor').value;
    const font = document.getElementById('labelFont').value;
    const fontSize = document.getElementById('labelFontSize').value;

    const polygon = L.polygon(latlngs, {
      color: strokeColor,
      fillColor: fillColor,
      fillOpacity:0.5
    }).addTo(drawnItems);

    const name = prompt("Enter a name for this freehand shape:");
    if(name){
      const center = polygon.getBounds().getCenter();
      const marker = L.marker(center, {
        icon: createLabelIcon(name, labelColor, font, fontSize),
        draggable: true
      }).addTo(drawnItems);
    }
    map.removeLayer(currentLine);
  }
  currentLine = null;
});

// --- Eraser Feature ---
let isErasing = false;
const eraserButton = document.getElementById('toggleEraser');

eraserButton.addEventListener('click', () => toggleEraser(!isErasing));

function toggleEraser(state) {
  isErasing = state;
  eraserButton.textContent = isErasing ? "Disable Eraser" : "Enable Eraser";
  if (isErasing) {
    if (isDrawing) { isDrawing = false; pencilButton.textContent = "Enable Freehand Pencil"; }
    map.getContainer().style.cursor = "not-allowed";
    map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
    map.scrollWheelZoom.disable(); map.boxZoom.disable(); map.keyboard.disable();

    // Add click listener to erase
    map.on('click', eraseHandler);
  } else {
    map.getContainer().style.cursor = "";
    map.dragging.enable(); map.touchZoom.enable(); map.doubleClickZoom.enable();
    map.scrollWheelZoom.enable(); map.boxZoom.enable(); map.keyboard.enable();

    map.off('click', eraseHandler);
  }
}

function eraseHandler(e) {
  let erased = false;
  drawnItems.eachLayer(layer => {
    if (layer instanceof L.Polygon || layer instanceof L.Polyline || layer instanceof L.Circle) {
      if (layer.getBounds().contains(e.latlng)) {
        drawnItems.removeLayer(layer);
        erased = true;
      }
    }
  });
  if (erased) console.log("Shape erased at", e.latlng);
}

// --- Export functions ---
function exportGeoJSON(){
  const geojson = drawnItems.toGeoJSON();
  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(geojson, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = 'drawing.geojson';
  a.click();
}

function exportPNG(){
  domtoimage.toPng(document.getElementById('map'))
    .then(dataUrl => {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'map_drawing.png';
      a.click();
    })
    .catch(error => console.error('PNG export failed:', error));
}
</script>
</body>
</html>
