<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nayan's Touch-Enabled Interactive Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>

<style>
  body { margin:0; font-family:Arial; }
  #map {
    width:100%;
    height:90vh;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #toolbar { padding:8px; text-align:center; background:#f0f0f0; }
  select, button, input { margin:3px; padding:5px 10px; }
  .polygon-label { cursor:pointer; }
</style>
</head>

<body>

<h2 style="text-align:center;">Nayan's Full Touch Interactive Map</h2>

<div id="toolbar">
  <label>Fill:</label>
  <select id="fillColor">
    <option value="orange" selected>Orange</option>
    <option value="red">Red</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>
    <option value="yellow">Yellow</option>
  </select>

  <label>Stroke:</label>
  <select id="strokeColor">
    <option value="red" selected>Red</option>
    <option value="black">Black</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
  </select>

  <label>Label:</label>
  <input type="color" id="labelColor" value="#000000">

  <label>Font:</label>
  <select id="labelFont">
    <option value="Arial" selected>Arial</option>
    <option value="Verdana">Verdana</option>
    <option value="Georgia">Georgia</option>
  </select>

  <label>Size:</label>
  <select id="labelFontSize">
    <option value="14px" selected>14px</option>
    <option value="18px">18px</option>
    <option value="24px">24px</option>
  </select>

  <button id="togglePencil">Enable Freehand Pencil</button>
  <button id="toggleEraser">Enable Eraser</button>
  <button onclick="exportGeoJSON()">Export GeoJSON</button>
  <button onclick="exportPNG()">Export PNG</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
/* ---------------- MAP SETUP ---------------- */
const map = L.map('map', {
    center:[20,80],
    zoom:4,
    zoomControl:true,
    scrollWheelZoom:true,
    doubleClickZoom:true,
    touchZoom:true,
    tap:false
});

// IMPORTANT: allow normal touch gestures when NOT drawing
map.getContainer().style.touchAction = 'auto';

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
  maxZoom:19,
  crossOrigin: 'anonymous'
}).addTo(map);
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  crossOrigin: 'anonymous'
});
const terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  crossOrigin: 'anonymous'
});

L.control.layers({OSM:osm, Satellite:satellite, Terrain:terrain}).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

/* ---------------- INDIA GEOJSON ---------------- */
let indiaLayer = null;
fetch('india.geojson')
  .then(r => r.json())
  .then(data => {
    indiaLayer = L.geoJSON(data, {
      style:{ color:'#000', weight:2, fillColor:'#000', fillOpacity:0.1 },
      interactive:false
    }).addTo(map);
  })
  .catch(err => console.log('India GeoJSON not found, skipping'));

/* ---------------- LABEL ICON ---------------- */
function createLabelIcon(text, color, font, size){
  return L.divIcon({
    className:"polygon-label",
    html:`<span style="color:${color}; font-family:${font}; font-size:${size}; font-weight:bold;">${text}</span>`
  });
}

/* ---------------- LEAFLET DRAW ---------------- */
const drawControl = new L.Control.Draw({
    draw:{ polyline:false },
    edit:{ featureGroup:drawnItems }
});
map.addControl(drawControl);

map.on("draw:created", e => {
    const layer = e.layer;
    drawnItems.addLayer(layer);
    const name = prompt("Enter name:");
    if(name){
        L.marker(layer.getBounds().getCenter(), {
            icon:createLabelIcon(name, labelColor.value, labelFont.value, labelFontSize.value),
            draggable:true
        }).addTo(drawnItems);
    }
});

/* ---------------- FREEHAND DRAWING ---------------- */
let isDrawing=false, isErasing=false, currentLine=null;
const mapContainer = map.getContainer();

function getLatLng(e){
  const rect = mapContainer.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return map.containerPointToLatLng([
    t.clientX - rect.left,
    t.clientY - rect.top
  ]);
}

togglePencil.onclick=()=>{
  isDrawing=!isDrawing;
  if(isDrawing){
    map.dragging.disable();
    map.scrollWheelZoom.disable();
    map.doubleClickZoom.disable();
    map.touchZoom.disable();
    map.getContainer().style.touchAction='none';
  } else {
    map.dragging.enable();
    map.scrollWheelZoom.enable();
    map.doubleClickZoom.enable();
    map.touchZoom.enable();
    map.getContainer().style.touchAction='auto';
  }
  togglePencil.textContent=isDrawing?"Disable Freehand":"Enable Freehand";
};

mapContainer.addEventListener('touchstart',e=>{
  if(!isDrawing) return;
  e.preventDefault();
  currentLine=L.polyline([getLatLng(e)],{color:strokeColor.value,weight:3}).addTo(drawnItems);
},{passive:false});

mapContainer.addEventListener('touchmove',e=>{
  if(!isDrawing||!currentLine) return;
  e.preventDefault();
  currentLine.addLatLng(getLatLng(e));
},{passive:false});

mapContainer.addEventListener('touchend',()=>{
  if(!currentLine) return;
  const pts=currentLine.getLatLngs();
  drawnItems.removeLayer(currentLine);
  currentLine=null;
  if(pts.length<3) return;
  const poly=L.polygon(pts,{color:strokeColor.value,fillColor:fillColor.value,fillOpacity:0.5}).addTo(drawnItems);
  const name=prompt('Enter name:');
  if(name){
    L.marker(poly.getBounds().getCenter(),{icon:createLabelIcon(name,labelColor.value,labelFont.value,labelFontSize.value),draggable:true}).addTo(drawnItems);
  }
});

mapContainer.addEventListener('mousedown',e=>{
  if(!isDrawing) return;
  currentLine=L.polyline([getLatLng(e)],{color:strokeColor.value,weight:3}).addTo(drawnItems);
});

mapContainer.addEventListener('mousemove',e=>{
  if(isDrawing&&currentLine) currentLine.addLatLng(getLatLng(e));
});

mapContainer.addEventListener('mouseup',()=>{
  if(!currentLine) return;
  const pts=currentLine.getLatLngs();
  drawnItems.removeLayer(currentLine);
  currentLine=null;
  if(pts.length<3) return;
  const poly=L.polygon(pts,{color:strokeColor.value,fillColor:fillColor.value,fillOpacity:0.5}).addTo(drawnItems);
  const name=prompt('Enter name:');
  if(name){
    L.marker(poly.getBounds().getCenter(),{icon:createLabelIcon(name,labelColor.value,labelFont.value,labelFontSize.value),draggable:true}).addTo(drawnItems);
  }
});


toggleEraser.onclick=()=>{
  isErasing=!isErasing;
  map.dragging[isErasing?'disable':'enable']();
  toggleEraser.textContent=isErasing?"Disable Eraser":"Enable Eraser";
};

map.on('click',e=>{
  if(!isErasing) return;
  drawnItems.eachLayer(l=>{ if(l.getBounds&&l.getBounds().contains(e.latlng)) drawnItems.removeLayer(l); });
});

/* ---------------- EXPORT ---------------- */
function exportGeoJSON(){
  const g=drawnItems.toGeoJSON();
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(JSON.stringify(g,null,2));
  a.download='drawing.geojson'; 
  a.click();
}

function exportPNG(){
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = 'Exporting...';
  btn.disabled = true;
  
  setTimeout(() => {
    try {
      // Get map size
      const size = map.getSize();
      
      // Create canvas
      const canvas = document.createElement('canvas');
      canvas.width = size.x;
      canvas.height = size.y;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      
      // White background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Try to draw tiles (might fail due to CORS)
      let tilesDrawn = false;
      try {
        const tiles = document.querySelectorAll('.leaflet-tile-pane img.leaflet-tile');
        
        tiles.forEach(tile => {
          if (tile.complete && tile.naturalHeight !== 0) {
            const style = tile.style.transform || tile.style.webkitTransform;
            const match = style.match(/translate3d\((-?\d+)px,\s*(-?\d+)px/);
            
            if (match) {
              const x = parseInt(match[1]);
              const y = parseInt(match[2]);
              ctx.drawImage(tile, x, y, 256, 256);
              tilesDrawn = true;
            }
          }
        });
      } catch (e) {
        console.log('Could not draw tiles (CORS):', e);
      }
      
      // If tiles couldn't be drawn, add a light gray background
      if (!tilesDrawn) {
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add grid pattern
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }
      
      // Draw India GeoJSON layer
      if (indiaLayer) {
        indiaLayer.eachLayer(layer => {
          if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
            const latlngs = layer.getLatLngs();
            
            // Handle MultiPolygon
            const polygons = Array.isArray(latlngs[0][0]) ? latlngs : [latlngs];
            
            polygons.forEach(polygon => {
              const points = Array.isArray(polygon[0]) ? polygon[0] : polygon;
              
              if (points.length > 0) {
                ctx.beginPath();
                points.forEach((latlng, i) => {
                  const point = map.latLngToContainerPoint(latlng);
                  if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                  } else {
                    ctx.lineTo(point.x, point.y);
                  }
                });
                ctx.closePath();
                
                ctx.fillStyle = '#000';
                ctx.globalAlpha = 0.1;
                ctx.fill();
                ctx.globalAlpha = 1;
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
              }
            });
          }
        });
      }
      
      // Draw World GeoJSON layer
      if (worldLayer) {
        worldLayer.eachLayer(layer => {
          if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
            const latlngs = layer.getLatLngs();
            
            // Handle MultiPolygon
            const polygons = Array.isArray(latlngs[0][0]) ? latlngs : [latlngs];
            
            polygons.forEach(polygon => {
              const points = Array.isArray(polygon[0]) ? polygon[0] : polygon;
              
              if (points.length > 0) {
                ctx.beginPath();
                points.forEach((latlng, i) => {
                  const point = map.latLngToContainerPoint(latlng);
                  if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                  } else {
                    ctx.lineTo(point.x, point.y);
                  }
                });
                ctx.closePath();
                
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            });
          }
        });
      }
      
      // Draw polygons
      drawnItems.eachLayer(layer => {
        if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
          const latlngs = layer.getLatLngs();
          const points = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
          
          if (points.length > 0) {
            ctx.beginPath();
            
            points.forEach((latlng, i) => {
              const point = map.latLngToContainerPoint(latlng);
              if (i === 0) {
                ctx.moveTo(point.x, point.y);
              } else {
                ctx.lineTo(point.x, point.y);
              }
            });
            
            if (layer instanceof L.Polygon) {
              ctx.closePath();
              ctx.fillStyle = layer.options.fillColor || 'orange';
              ctx.globalAlpha = layer.options.fillOpacity || 0.5;
              ctx.fill();
              ctx.globalAlpha = 1;
            }
            
            ctx.strokeStyle = layer.options.color || 'red';
            ctx.lineWidth = layer.options.weight || 3;
            ctx.stroke();
          }
        }
      });
      
      // Draw marker labels
      const markers = document.querySelectorAll('.leaflet-marker-pane .polygon-label');
      markers.forEach(marker => {
        const rect = marker.getBoundingClientRect();
        const mapRect = mapContainer.getBoundingClientRect();
        const x = rect.left - mapRect.left;
        const y = rect.top - mapRect.top;
        
        const span = marker.querySelector('span');
        if (span) {
          const text = span.textContent;
          const color = span.style.color || '#000';
          const font = span.style.fontFamily || 'Arial';
          const fontSize = span.style.fontSize || '14px';
          
          // Measure text
          ctx.font = `bold ${fontSize} ${font}`;
          const textMetrics = ctx.measureText(text);
          const textWidth = textMetrics.width;
          const textHeight = parseInt(fontSize);
          
          // Draw rounded rectangle background
          const padding = 6;
          const rectX = x - padding;
          const rectY = y - padding;
          const rectWidth = textWidth + padding * 2;
          const rectHeight = textHeight + padding * 2;
          const radius = 6;
          
          // Background with rounded corners
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.moveTo(rectX + radius, rectY);
          ctx.lineTo(rectX + rectWidth - radius, rectY);
          ctx.quadraticCurveTo(rectX + rectWidth, rectY, rectX + rectWidth, rectY + radius);
          ctx.lineTo(rectX + rectWidth, rectY + rectHeight - radius);
          ctx.quadraticCurveTo(rectX + rectWidth, rectY + rectHeight, rectX + rectWidth - radius, rectY + rectHeight);
          ctx.lineTo(rectX + radius, rectY + rectHeight);
          ctx.quadraticCurveTo(rectX, rectY + rectHeight, rectX, rectY + rectHeight - radius);
          ctx.lineTo(rectX, rectY + radius);
          ctx.quadraticCurveTo(rectX, rectY, rectX + radius, rectY);
          ctx.closePath();
          ctx.fill();
          
          // Border with rounded corners
          ctx.strokeStyle = 'rgba(102, 126, 234, 0.5)';
          ctx.lineWidth = 2;
          ctx.stroke();
          
          // Text
          ctx.fillStyle = color;
          ctx.textBaseline = 'top';
          ctx.fillText(text, x, y);
        }
      });
      
      // Download the canvas
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'map-export-' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        btn.textContent = originalText;
        btn.disabled = false;
        
        if (!tilesDrawn) {
          alert('Note: Map tiles could not be exported due to CORS restrictions. Only your drawings and labels were exported.');
        }
      }, 'image/png');
      
    } catch (err) {
      console.error('Export failed:', err);
      alert('Export failed: ' + err.message + '\n\nTip: Use your browser screenshot tool (Ctrl+Shift+S or Cmd+Shift+5) to capture the full map.');
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }, 500);
}

/* ---------------- WORLD + WIKIPEDIA ---------------- */
let worldLayer = null;
fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
.then(r=>r.json())
.then(world=>{
  worldLayer = L.geoJSON(world,{style:{color:'#666',weight:1,fillOpacity:0}})
  .on('click',e=>{
    const name=e.layer.feature.properties.name;
    map.fitBounds(e.layer.getBounds());
    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`)
    .then(r=>r.json())
    .then(info=>{
      let html=`<b>${name}</b><br><br>${info.extract||''}<br><br>`;
      if(info.content_urls) html+=`<a href="${info.content_urls.desktop.page}" target="_blank">Open Wikipedia</a>`;
      L.popup().setLatLng(e.latlng).setContent(html).openOn(map);
    });
  }).addTo(map);
})
.catch(err => console.log('World GeoJSON loading skipped'));

/* ---------------- SEARCH ---------------- */
L.Control.geocoder({ defaultMarkGeocode:false })
.on('markgeocode',e=>map.fitBounds(e.geocode.bbox))
.addTo(map);
</script>
</body>
</html>
